name: Jexactyl Two-Account Earn + Primary Renew

on:
  # 每 6 小时检查一次；四天等待期结束后运行 340 分钟双账号积分任务。
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      run_minutes:
        description: "本轮运行分钟数"
        required: false
        default: "340"
      force:
        description: "忽略四天等待期立即运行（true/false）"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: jexactyl-two-account-earn
  cancel-in-progress: false

jobs:
  earn:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout Jexactyl branch
        uses: actions/checkout@v4
        with:
          ref: Jexactyl
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --upgrade requests cryptography

      - name: Use direct panel address
        run: echo "13.140.147.61 panel.cyrahost.xyz" | sudo tee -a /etc/hosts

      - name: Run Jexactyl cross-site two-account earn
        env:
          JEXACTYL_API_KEY: ${{ secrets.JEXACTYL_API_KEY }}
          JEXACTYL_EMAIL: ${{ secrets.JEXACTYL_EMAIL }}
          JEXACTYL_PASSWORD: ${{ secrets.JEXACTYL_PASSWORD }}
          JEXACTYL_SESSION_KEY: ${{ secrets.JEXACTYL_SESSION_KEY }}
          JEXACTYL_PRIMARY_BASE_URL: "https://panel.cyrahost.xyz"
          JEXACTYL_SECONDARY_BASE_URL: "https://console.zraa.me"
          JEXACTYL_SERVER_UUID: "1c8f44f1-a8b2-4abb-b5ad-3950ab451b30"
          RUN_MINUTES: ${{ github.event.inputs.run_minutes || '340' }}
          INTERVAL_SECONDS: "61"
          FORCE_RUN: ${{ github.event.inputs.force || 'false' }}
        run: python earn_jexactyl.py

      - name: Save Jexactyl state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jexactyl_state.json || true
          if git diff --cached --quiet; then
            echo "No Jexactyl state change."
            exit 0
          fi
          git commit -m "Update Jexactyl two-account state [skip ci]"
          git push origin HEAD:Jexactyl
