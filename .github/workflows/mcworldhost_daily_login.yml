name: MCWorldHost Daily Login

on:
  schedule:
    - cron: '15 1 * * *' # Daily at 01:15 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcworldhost-daily-login
  cancel-in-progress: false

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install browser automation
        run: |
          python -m pip install --quiet playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Claim daily login coins
        env:
          MCWH_EMAIL: ${{ secrets.MCWH_EMAIL }}
          MCWH_PASSWORD: ${{ secrets.MCWH_PASSWORD }}
        run: python .github/scripts/mcworldhost_daily_login.py
