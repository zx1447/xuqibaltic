name: CastleHost Server Check

on:
  # 暂时只保留手动运行；等确认续期周期/POST 接口后再开启 schedule。
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: castlehost-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout CastleHost branch
        uses: actions/checkout@v4
        with:
          ref: castlehost
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install and Start Cloudflare WARP SOCKS5 Proxy
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ noble main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp
          sudo warp-svc &
          sleep 3
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode proxy || true
          warp-cli --accept-tos proxy port 40001 || true
          warp-cli --accept-tos connect || true
          sleep 5
          echo "=== WARP SOCKS5 PROXY CHECK ==="
          curl -x socks5h://127.0.0.1:40001 https://ipinfo.io/json || true

      - name: Install Playwright stealth browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          npm install
          npx playwright install-deps chrome

      - name: Run CastleHost Playwright-Stealth check
        env:
          CASTLEHOST_COOKIE: ${{ secrets.CASTLEHOST_COOKIE }}
          CASTLEHOST_EMAIL: ${{ secrets.CASTLEHOST_EMAIL }}
          CASTLEHOST_PASSWORD: ${{ secrets.CASTLEHOST_PASSWORD }}
          CASTLEHOST_SERVER_ID: ${{ secrets.CASTLEHOST_SERVER_ID || '140640' }}
          CASTLEHOST_PROXY: ${{ secrets.CASTLEHOST_PROXY || 'socks5://127.0.0.1:40001' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1365x768x24" node castlehost_browser.js

      - name: Save CastleHost state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add castlehost_state.json || true
          if git diff --cached --quiet; then
            echo "No CastleHost state change."
            exit 0
          fi
          git commit -m "Update CastleHost state [skip ci]"
          git push origin HEAD:castlehost
