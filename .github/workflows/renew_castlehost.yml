name: CastleHost Server Check

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: castlehost-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout CastleHost branch
        uses: actions/checkout@v4
        with:
          ref: castlehost
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SeleniumBase browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk jq wget gnupg
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add - 2>/dev/null || true
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable || sudo apt-get install -y chromium-browser
          google-chrome --version || chromium-browser --version
          pip install --upgrade pip seleniumbase requests "requests[socks]"
          seleniumbase install chromedriver

      - name: Optional proxy setup by NODE_LINK (sing-box)
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: Run CastleHost check by Zytrano/Bot-hosting style
        env:
          CASTLEHOST_COOKIE: ${{ secrets.CASTLEHOST_COOKIE }}
          CASTLEHOST_EMAIL: ${{ secrets.CASTLEHOST_EMAIL }}
          CASTLEHOST_PASSWORD: ${{ secrets.CASTLEHOST_PASSWORD }}
          CASTLEHOST_SERVER_ID: ${{ secrets.CASTLEHOST_SERVER_ID || '140640' }}
          CASTLEHOST_PROXY: ${{ env.PROXY_SERVER }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: xvfb-run --auto-servernum python3 renew_castlehost.py

      - name: Save CastleHost state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add castlehost_state.json || true
          if git diff --cached --quiet; then
            echo "No CastleHost state change."
            exit 0
          fi
          git commit -m "Update CastleHost state [skip ci]"
          git push origin HEAD:castlehost
