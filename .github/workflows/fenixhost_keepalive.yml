name: FenixHost Account Keepalive

on:
  workflow_dispatch:
  # 首次登录验证通过后再启用定时任务。

permissions:
  contents: write

concurrency:
  group: fenixhost-account-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout clean FenixHost branch
        uses: actions/checkout@v4
        with:
          ref: fenixhost
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser dependencies
        run: |
          pip install --upgrade seleniumbase cryptography requests beautifulsoup4
          seleniumbase install chromedriver

      - name: Run FenixHost account keepalive
        env:
          FENIXHOST_EMAIL: ${{ secrets.FENIXHOST_EMAIL }}
          FENIXHOST_PASSWORD: ${{ secrets.FENIXHOST_PASSWORD }}
          FENIXHOST_SESSION_KEY: ${{ secrets.FENIXHOST_SESSION_KEY }}
        run: python fenixhost.py

      - name: Save FenixHost state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fenixhost_state.json || true
          if git diff --cached --quiet; then
            echo "No FenixHost state change."
            exit 0
          fi
          git commit -m "Update FenixHost state [skip ci]"
          git push origin HEAD:fenixhost
