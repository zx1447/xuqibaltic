name: PortalMine Server State Check

on:
  workflow_dispatch:
    inputs:
      poll_count:
        description: "server_state/ws_info 检查次数（默认 1；最多 10）"
        required: false
        default: "1"
      poll_seconds:
        description: "多次检查时的间隔秒数（默认 60）"
        required: false
        default: "60"
  schedule:
    - cron: "0 0,6,12,18 * * *"

permissions:
  contents: write

concurrency:
  group: portalmine-state-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PortalMine branch
        uses: actions/checkout@v4
        with:
          ref: portalmine
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --upgrade pip requests

      - name: Run PortalMine state check
        env:
          PORTALMINE_USER: ${{ secrets.PORTALMINE_USER }}
          PORTALMINE_PASS: ${{ secrets.PORTALMINE_PASS }}
          PORTALMINE_COOKIE: ${{ secrets.PORTALMINE_COOKIE }}
          PORTALMINE_SERVER_ID: ${{ secrets.PORTALMINE_SERVER_ID || '1388' }}
          PORTALMINE_POLL_COUNT: ${{ github.event.inputs.poll_count || '1' }}
          PORTALMINE_POLL_SECONDS: ${{ github.event.inputs.poll_seconds || '60' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python renew_portalmine.py

      - name: Save PortalMine state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portalmine_state.json || true
          if git diff --cached --quiet; then
            echo "No PortalMine state change."
            exit 0
          fi
          git commit -m "Update PortalMine state [skip ci]"
          git push origin HEAD:portalmine
