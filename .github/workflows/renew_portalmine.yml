name: PortalMine Server State Check

on:
  workflow_dispatch:
    inputs:
      poll_count:
        description: "server_state 检查次数（默认 1；最多 10）"
        required: false
        default: "1"
      poll_seconds:
        description: "多次检查时的间隔秒数（默认 60）"
        required: false
        default: "60"
      auto_coins:
        description: "自动领取金币（默认 false）"
        required: false
        type: boolean
        default: false
      ad_forever:
        description: "持续领金币直到 workflow 超时（默认 false，开启后忽略 ad_max_rounds）"
        required: false
        type: boolean
        default: false
      ad_max_rounds:
        description: "金币最大轮数（ad_forever=false 时生效，默认 1）"
        required: false
        default: "1"
      ad_max_runtime:
        description: "forever 模式最大运行秒数（默认 18000=5h）"
        required: false
        default: "18000"
      monitor_seconds:
        description: "领取金币期间的服务器监控间隔（默认 840=14分钟）"
        required: false
        default: "840"
      restart_after_run:
        description: "本轮结束等待44分钟后启动下一轮（true/false）"
        required: false
        type: boolean
        default: true
  schedule:
    # 每天一次兜底启动；正常情况下由上一轮等待 44 分钟后自动启动下一轮。
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: portalmine-state-check
  cancel-in-progress: false  # 不取消正在跑的, 避免打断 forever 模式

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours (GitHub Actions max)
    steps:
      - name: Checkout PortalMine branch
        uses: actions/checkout@v4
        with:
          ref: portalmine
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --upgrade pip requests

      - name: Run PortalMine state check
        env:
          PORTALMINE_USER: ${{ secrets.PORTALMINE_USER }}
          PORTALMINE_PASS: ${{ secrets.PORTALMINE_PASS }}
          PORTALMINE_COOKIE: ${{ secrets.PORTALMINE_COOKIE }}
          PORTALMINE_SERVER_ID: ${{ secrets.PORTALMINE_SERVER_ID }}
          PORTALMINE_POLL_COUNT: ${{ github.event.inputs.poll_count || '1' }}
          PORTALMINE_POLL_SECONDS: ${{ github.event.inputs.poll_seconds || '60' }}
          PORTALMINE_AUTO_START: "1"
          PORTALMINE_AUTO_START_POLL_SECONDS: "15"
          PORTALMINE_AUTO_START_MAX_POLLS: "20"
          PORTALMINE_SERVER_MONITOR_SECONDS: ${{ github.event.inputs.monitor_seconds || '840' }}
          # schedule 触发时 github.event.inputs 为空, 用 schedule 自动开 forever
          # workflow_dispatch 时按用户选择
          PORTALMINE_AUTO_COINS: ${{ (github.event_name == 'schedule' || github.event.inputs.auto_coins == 'true' || github.event.inputs.ad_forever == 'true') && '1' || '' }}
          PORTALMINE_AD_FOREVER: ${{ (github.event_name == 'schedule' || github.event.inputs.ad_forever == 'true') && '1' || '' }}
          PORTALMINE_AD_MAX_ROUNDS: ${{ github.event.inputs.ad_max_rounds || '1' }}
          PORTALMINE_AD_MAX_RUNTIME: ${{ github.event.inputs.ad_max_runtime || '18000' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python renew_portalmine.py

      - name: Save PortalMine state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portalmine_state.json || true
          if git diff --cached --quiet; then
            echo "No PortalMine state change."
            exit 0
          fi
          git commit -m "Update PortalMine state [skip ci]"
          git push origin HEAD:portalmine

      - name: Wait 44 minutes and start next PortalMine workflow
        if: ${{ success() && (github.event_name == 'schedule' || (github.event.inputs.ad_forever == 'true' && github.event.inputs.restart_after_run != 'false')) }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          echo "⏳ 本轮积分任务已结束，等待 44 分钟后启动下一轮…"
          sleep 2640
          python - <<'PY'
          import os
          import requests

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ.get("GH_PAT", "").strip()
          if not token:
              raise SystemExit("GH_PAT is missing")
          response = requests.post(
              f"https://api.github.com/repos/{repository}/actions/workflows/renew_portalmine.yml/dispatches",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              json={
                  "ref": "portalmine",
                  "inputs": {
                      "poll_count": "1",
                      "poll_seconds": "60",
                      "auto_coins": "true",
                      "ad_forever": "true",
                      "ad_max_rounds": "1",
                      "ad_max_runtime": "18000",
                      "monitor_seconds": "840",
                      "restart_after_run": "true",
                  },
              },
              timeout=30,
          )
          print(f"dispatch HTTP {response.status_code}")
          if response.status_code != 204:
              raise SystemExit(response.text[:500])
          print("✅ 下一轮 PortalMine workflow 已启动")
          PY
