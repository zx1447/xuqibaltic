name: CyraHost Earn + 7-Day Renew

on:
  # 每 6 小时检查一次；只有四天等待期结束后才会运行 340 分钟积分轮次。
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      run_minutes:
        description: "本轮运行分钟数"
        required: false
        default: "340"
      force:
        description: "忽略四天等待期立即运行（true/false）"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: cyrahost-earn-heartbeat
  cancel-in-progress: false

jobs:
  earn:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout clean cyrahost branch
        uses: actions/checkout@v4
        with:
          ref: cyrahost
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --upgrade requests

      - name: Use CyraHost direct panel address
        run: echo "13.140.147.61 panel.cyrahost.xyz" | sudo tee -a /etc/hosts

      - name: Run CyraHost earn and renew
        env:
          CYRAHOST_API_KEY: ${{ secrets.CYRAHOST_API_KEY }}
          CYRAHOST_SERVER_UUID: "1c8f44f1-a8b2-4abb-b5ad-3950ab451b30"
          RUN_MINUTES: ${{ github.event.inputs.run_minutes || '340' }}
          INTERVAL_SECONDS: "61"
          FORCE_RUN: ${{ github.event.inputs.force || 'false' }}
        run: python earn_cyrahost.py

      - name: Save heartbeat and renewal state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cyrahost_state.json || true
          if git diff --cached --quiet; then
            echo "No CyraHost state change."
            exit 0
          fi
          git commit -m "Update CyraHost earn/renew state [skip ci]"
          git push origin HEAD:cyrahost
