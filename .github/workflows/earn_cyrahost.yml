name: CyraHost Earn + 7-Day Renew

on:
  # 兜底触发；正常情况下每轮结束后会自行启动下一轮。
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      run_minutes:
        description: "本轮运行分钟数"
        required: false
        default: "340"

permissions:
  contents: write

concurrency:
  group: cyrahost-earn-heartbeat
  cancel-in-progress: false

jobs:
  earn:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout clean cyrahost branch
        uses: actions/checkout@v4
        with:
          ref: cyrahost
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --upgrade requests

      - name: Run CyraHost earn and renew
        env:
          CYRAHOST_API_KEY: ${{ secrets.CYRAHOST_API_KEY }}
          CYRAHOST_SERVER_UUID: "1c8f44f1-a8b2-4abb-b5ad-3950ab451b30"
          RUN_MINUTES: ${{ github.event.inputs.run_minutes || '340' }}
          INTERVAL_SECONDS: "61"
        run: python earn_cyrahost.py

      - name: Save heartbeat and renewal state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cyrahost_state.json || true
          if git diff --cached --quiet; then
            echo "No CyraHost state change."
            exit 0
          fi
          git commit -m "Update CyraHost earn/renew state [skip ci]"
          git push origin HEAD:cyrahost

      - name: Re-trigger next round
        if: success()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          sleep 45
          code=$(curl -sS -o /tmp/cyrahost-dispatch.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: token ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/earn_cyrahost.yml/dispatches" \
            -d '{"ref":"cyrahost","inputs":{"run_minutes":"340"}}')
          if [ "$code" != "204" ]; then
            echo "Re-dispatch failed: HTTP $code"
            cat /tmp/cyrahost-dispatch.json
            exit 1
          fi
          echo "Next CyraHost round dispatched."
