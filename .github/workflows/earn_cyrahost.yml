name: CyraHost Earn Heartbeat

on:
  # 兜底触发；正常情况下每轮结束后会自行启动下一轮。
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      run_minutes:
        description: "本轮运行分钟数"
        required: false
        default: "340"

permissions:
  contents: write

concurrency:
  group: cyrahost-earn-heartbeat
  cancel-in-progress: false

jobs:
  earn:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout clean cyrahost branch
        uses: actions/checkout@v4
        with:
          ref: cyrahost
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and Xray
        run: |
          pip install --upgrade 'requests[socks]'
          mkdir -p /tmp/cyrahost-xray
          XRAY_TAG=$(curl -fsSL -H "User-Agent: cyrahost-heartbeat" https://api.github.com/repos/XTLS/Xray-core/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
          curl -fsSL "https://github.com/XTLS/Xray-core/releases/download/${XRAY_TAG}/Xray-linux-64.zip" -o /tmp/cyrahost-xray/xray.zip
          unzip -q /tmp/cyrahost-xray/xray.zip -d /tmp/cyrahost-xray
          chmod +x /tmp/cyrahost-xray/xray
          /tmp/cyrahost-xray/xray version | head -1

      - name: Run CyraHost earn heartbeat
        env:
          CYRAHOST_API_KEY: ${{ secrets.CYRAHOST_API_KEY }}
          CYRAHOST_PROXY_VLESS_URI: ${{ secrets.CYRAHOST_PROXY_VLESS_URI }}
          CYRAHOST_PROXY: "socks5h://127.0.0.1:1080"
          RUN_MINUTES: ${{ github.event.inputs.run_minutes || '340' }}
          INTERVAL_SECONDS: "62"
        run: |
          python3 setup_vless_proxy.py
          /tmp/cyrahost-xray/xray run -c /tmp/cyrahost-xray/config.json >/tmp/cyrahost-xray/xray.log 2>&1 &
          XRAY_PID=$!
          trap 'kill "$XRAY_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS --max-time 5 -x socks5h://127.0.0.1:1080 https://www.cloudflare.com/cdn-cgi/trace >/tmp/cyrahost-xray/trace; then
              break
            fi
            sleep 1
          done
          grep -E '^(ip|loc|warp)=' /tmp/cyrahost-xray/trace
          python earn_cyrahost.py

      - name: Save heartbeat state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cyrahost_state.json || true
          if git diff --cached --quiet; then
            echo "No CyraHost state change."
            exit 0
          fi
          git commit -m "Update CyraHost earn state [skip ci]"
          git push origin HEAD:cyrahost

      - name: Re-trigger next round
        if: success()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          sleep 45
          code=$(curl -sS -o /tmp/cyrahost-dispatch.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: token ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/earn_cyrahost.yml/dispatches" \
            -d '{"ref":"cyrahost","inputs":{"run_minutes":"340"}}')
          if [ "$code" != "204" ]; then
            echo "Re-dispatch failed: HTTP $code"
            cat /tmp/cyrahost-dispatch.json
            exit 1
          fi
          echo "Next CyraHost round dispatched."
