name: bkt Renew

# 免费服自动续期（+8h / 次，窗口 = 到期前 2h 或过期后）
#  · 【2026-11-13 改版】GitHub schedule 调度饿死（全仓 35 个 workflow 抢调度，
#    20 分钟 cron 实际只送 ~4 次/天），窗口开了没人来 → 服务器过期。
#    改为"长驻循环 + 自派发接力"：一次触发守 ~5.5h（脚本 --loop 每 20 分钟
#    复查，窗口开即解算续期），结束时用 GH_PAT 自派发下一轮（workflow_dispatch
#    不受饿死影响），schedule 仅作兜底。
#  · browser 解算器 = 家宽订阅出口（xray SOCKS5）+ undetected-chromedriver
#    真浏览器 + pyautogui 屏幕真点击，续期 POST 在浏览器页面内提交
#    —— 2026-11-13 实弹成功：PL 家宽出口 → 真点击 → token 794 字符 → +8h
#  · 站点常量/订阅地址已在脚本内 b64 混淆，日志脱敏
on:
  schedule:
    - cron: '8,28,48 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '无视窗口强行尝试（调试）'
        required: false
        default: ''
      solver:
        description: '覆盖解算器（capsolver/2captcha/browser/manual/auto）'
        required: false
        default: ''
      run_minutes:
        description: '本轮守护时长（分钟，默认 330）'
        required: false
        default: '330'

concurrency:
  group: bkt-renew-${{ github.ref_name || 'manual' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bkt

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install xray + Chrome + UC 依赖（长驻循环全程就绪）
        run: |
          mkdir -p "$HOME/.xray"
          curl -fsSL -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -oq /tmp/xray.zip -d "$HOME/.xray"
          chmod +x "$HOME/.xray/xray"
          echo "XRAY_BIN=$HOME/.xray/xray" >> "$GITHUB_ENV"
          "$HOME/.xray/xray" version | head -1
          google-chrome --version || sudo apt-get install -y google-chrome-stable
          which xvfb-run || sudo apt-get install -y xvfb
          pip install --upgrade pip
          pip install undetected-chromedriver pyautogui python-xlib setuptools

      - name: 守护循环（每 20 分钟复查，窗口开即解算续期）
        id: renew
        env:
          BH_COOKIE: ${{ secrets.BH_COOKIE }}
          BH_PAT: ${{ secrets.BH_PAT }}
          BH_SOLVER: ${{ github.event.inputs.solver || secrets.BH_SOLVER || 'auto' }}
          BH_CAPSOLVER_KEY: ${{ secrets.BH_CAPSOLVER_KEY }}
          BH_2CAPTCHA_KEY: ${{ secrets.BH_2CAPTCHA_KEY }}
          BH_FORCE: ${{ github.event.inputs.force }}
          RUN_MINUTES: ${{ github.event.inputs.run_minutes || '330' }}
        run: xvfb-run -a -s "-screen 0 1280x900x24" python renew_bkt.py --loop "$RUN_MINUTES"

      - name: 汇总
        if: always()
        run: |
          echo "动作：${{ steps.renew.outputs.action }}"
          echo "剩余：${{ steps.renew.outputs.seconds_remaining }}s"
          echo "到期：${{ steps.renew.outputs.active_until }}"
          echo "增量：${{ steps.renew.outputs.gain_hours }}h"

      - name: 提交状态
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bkt_state.json || true
          git diff --cached --quiet && echo "无状态变化" && exit 0
          git commit -m "Update bkt state [skip ci]"
          # 状态回写竞态修复（2026-11-13）：并发/接力轮次会同时写 bkt 分支，
          # 裸 push 被 rejected (non-fast-forward) 会让整轮判 failure。
          # 这里 fetch+rebase 后重试，最多 3 次；仍失败只告警，不影响续期结论。
          for i in 1 2 3; do
            git fetch -q origin bkt || true
            git rebase origin/bkt >/dev/null 2>&1 || { git rebase --abort >/dev/null 2>&1 || true; git checkout --theirs bkt_state.json 2>/dev/null || true; }
            if git push origin HEAD:bkt; then
              echo "✅ 状态已回写 bkt（第 $i 次尝试）"
              exit 0
            fi
            echo "⚠️ 第 $i 次 push 被拒（多半是对端又推了新 state），重试…"
            sleep $((i * 3))
          done
          echo "⚠️ 状态回写失败（已重试 3 次）——本轮续期结果不受影响，下一轮会补写"

      - name: 自派发接力（下一轮守护）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT 未配置，跳过接力（schedule 兜底）"
            exit 0
          fi
          gh workflow run renew_bkt.yml -R "$GITHUB_REPOSITORY" -f run_minutes=330 \
            && echo "✅ 已派发下一轮守护" \
            || echo "⚠️ 接力派发失败（schedule 兜底）"
