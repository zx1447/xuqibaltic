name: BOT SERVER Daily Reward

on:
  workflow_dispatch:
  schedule:
    # 每 24 小时运行一次（北京时间 13:00）；脚本严格读取并遵守网站返回的 24 小时冷却。
    - cron: "0 5 * * *"

permissions:
  contents: write

concurrency:
  group: botserver-normal-daily-reward
  cancel-in-progress: true

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout clean botserver branch
        uses: actions/checkout@v4
        with:
          ref: botserver
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --upgrade requests cryptography beautifulsoup4

      - name: Check cooldown and claim once when ready
        env:
          BOTSERVER_DISCORD_TOKEN: ${{ secrets.BOTSERVER_DISCORD_TOKEN }}
          BOTSERVER_SESSION_KEY: ${{ secrets.BOTSERVER_SESSION_KEY }}
        run: python botserver_daily.py

      - name: Save BOT SERVER state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add botserver_state.json || true
          if git diff --cached --quiet; then
            echo "No BOT SERVER state change."
            exit 0
          fi
          git commit -m "Update BOT SERVER daily state [skip ci]"
          git push origin HEAD:botserver
