name: Q-Fi Cloud Renew

# Q-Fi Cloud（gp.qficloud.com，Pterodactyl + Dezerx 主题）免费服务器续期
#
# 端点：POST /api/client/dezerx/server-create/<UUID>/renew
# 认证：Authorization: Bearer <ptlc_...>（在站点 /account/api 页面创建）
#
# 节奏：每 2 天一次。cron 每天唤醒一次、由脚本按 last_click_at 判定，
#       这样即使某天 runner 排队延误，也只会晚 1 天，不会漏。
#
# 需要的 secret
#   QI_API_KEY   Pterodactyl Client API key（ptlc_ 开头）

on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "无视 2 天间隔立即续"
        required: false
        default: "false"
      dry_run:
        description: "只看状态不提交"
        required: false
        default: "false"
      interval_days:
        description: "间隔天数（默认 2）"
        required: false
        default: "2"

permissions:
  contents: write

concurrency:
  group: qi-renew
  cancel-in-progress: true

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 续期
        env:
          QI_API_KEY: ${{ secrets.QI_API_KEY }}
          QI_INTERVAL_DAYS: ${{ inputs.interval_days || '2' }}
          QI_FORCE: ${{ inputs.force == 'true' && '1' || '0' }}
          QI_DRY_RUN: ${{ inputs.dry_run == 'true' && '1' || '0' }}
        run: node renew_qi.js

      - name: 提交状态
        if: always()
        run: |
          rm -f package-lock.json
          git checkout -- . 2>/dev/null || true
          if [ -f qi_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add qi_state.json
            git diff --cached --quiet || git commit -m "chore(qi): 更新续期状态 [skip ci]"
            git pull --rebase --autostash origin qi || true
            git push origin HEAD:qi || true
          fi
