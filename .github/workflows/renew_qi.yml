name: Q-Fi Cloud Renew

# Q-Fi Cloud（gp.qficloud.com，Pterodactyl + Dezerx）免费服务器续期
#
# 节奏：服务端规则是「7 天一个周期，窗口在 renewAt 起 48 小时内」。
#       cron 只是"定期来看一眼"，真正决定何时提交的是脚本：
#         1. GET .../renewal 读 renewAt / renewable
#         2. 若窗口在本次可等范围内（QI_WAIT_MAX_MIN，默认 330 分钟）
#            → 直接 sleep 到 renewAt + slack 再 POST，做到分钟级精准
#         3. 若窗口还很远 → 只报告，交给后面的 cron 接力（每 6 小时一次）
#         4. 等待期间每 5 分钟复查，服务端提前开窗就立刻续
#
# 需要的 secret
#   QI_API_KEY   Pterodactyl Client API key（ptlc_ 开头，站点 /account/api 创建）

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "无视窗口立即续（会吃 400，仅调试）"
        required: false
        default: "false"
      dry_run:
        description: "只看状态不提交"
        required: false
        default: "false"
      wait:
        description: "精准等待到点再续（默认 true）"
        required: false
        default: "true"
      wait_max_min:
        description: "本次最多等多少分钟（默认 330）"
        required: false
        default: "330"

permissions:
  contents: write

concurrency:
  group: qi-renew
  cancel-in-progress: false     # 精准等待期间不要被下一次定时抢掉

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 续期（会睡到窗口开启）
        env:
          QI_API_KEY: ${{ secrets.QI_API_KEY }}
          QI_WAIT: ${{ inputs.wait == 'false' && '0' || '1' }}
          QI_WAIT_MAX_MIN: ${{ inputs.wait_max_min || '330' }}
          QI_FORCE: ${{ inputs.force == 'true' && '1' || '0' }}
          QI_DRY_RUN: ${{ inputs.dry_run == 'true' && '1' || '0' }}
          QI_INTERVAL_DAYS: "2"
        run: node renew_qi.js

      - name: 提交状态
        if: always()
        run: |
          rm -f package-lock.json
          git checkout -- . 2>/dev/null || true
          if [ -f qi_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add qi_state.json
            git diff --cached --quiet || git commit -m "chore(qi): 更新续期状态 [skip ci]"
            git pull --rebase --autostash origin qi || true
            git push origin HEAD:qi || true
          fi
