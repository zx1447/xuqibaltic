name: Open Hosting AFK Keepalive

# 持续运行：脚本挂住 AFK WebSocket 一轮（默认 340 分钟）后自然结束，
# 末尾步骤自动 re-dispatch 下一轮，形成 7x24 不间断保活链。
on:
  workflow_dispatch:
    inputs:
      run_minutes:
        description: "本轮挂住分钟数（GitHub 单 job 上限 360）"
        required: false
        default: "340"

permissions:
  contents: write

concurrency:
  group: openhosting-afk
  cancel-in-progress: false

jobs:
  afk:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout openhosting branch
        uses: actions/checkout@v4
        with:
          ref: openhosting
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --upgrade pip requests websocket-client cryptography

      - name: Run Open Hosting AFK keepalive
        env:
          OH_DISCORD_TOKEN: ${{ secrets.OH_DISCORD_TOKEN }}
          OH_SESSION_KEY: ${{ secrets.OH_SESSION_KEY }}
          OH_PROXY: ${{ secrets.OH_PROXY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RUN_MINUTES: ${{ github.event.inputs.run_minutes || '340' }}
        run: python renew_openhosting.py

      - name: Save AFK state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add openhosting_state.json || true
          if git diff --cached --quiet; then
            echo "No state change."
          else
            git commit -m "Update Open Hosting AFK state [skip ci]"
            git push origin HEAD:openhosting
          fi

      - name: Re-trigger next round (持续运行)
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          sleep 45
          echo "Re-dispatching next AFK round..."
          curl -s -X POST \
            -H "Authorization: token $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/zx1447/xuqibaltic/actions/workflows/renew_openhosting.yml/dispatches" \
            -d '{"ref":"openhosting","inputs":{"run_minutes":"340"}}' \
            -w "\ndispatch HTTP %{http_code}\n"
