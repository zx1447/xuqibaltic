name: Flarelax Server Monitor & Auto Renew

on:
  schedule:
    # 每 6 小时检测一次开机状态与到期情况。
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flarelax-server-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Flarelax branch
        uses: actions/checkout@v4
        with:
          ref: flarelax
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          google-chrome --version
          pip install --upgrade pip seleniumbase requests cryptography
          seleniumbase install chromedriver

      - name: Run Flarelax server status monitor and renewal
        env:
          FLARELAX_DISCORD_TOKEN: ${{ secrets.FLARELAX_DISCORD_TOKEN }}
          FLARELAX_SESSION_KEY: ${{ secrets.FLARELAX_SESSION_KEY }}
          FLARELAX_PROXY: ${{ secrets.FLARELAX_PROXY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: xvfb-run -a python3 renew_flarelax.py

      - name: Save Flarelax state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flarelax_state.json || true
          if git diff --cached --quiet; then
            echo "No Flarelax state change."
            exit 0
          fi
          git commit -m "Update Flarelax server state [skip ci]"
          git push origin HEAD:flarelax
