name: Antagonix Renew

# 每 4 天点一次 Discord 面板上的「Renouveler」，把到期时间重置为 现在 + 5 天。
# 不是每天检查：cron 本身按 4 天间隔排，其余日子完全不启动。
on:
  schedule:
    # 每月 1/5/9/13/17/21/25/29 号 UTC 04:17 跑一次（约每 4 天）。
    # cron 的日字段 */4 从 1 号起算，所以月底 29 号到下月 1 号只有 2-3 天，
    # 脚本会按「真实剩余天数」判断，间隔不足会自动跳过，不会重复点。
    - cron: "17 4 */4 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "true = 无视间隔立即点一次"
        required: false
        default: "false"
      dry_run:
        description: "true = 只看不点"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: antagonix-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: antagonix
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Antagonix renew
        env:
          ANTAGONIX_DISCORD_TOKEN: ${{ secrets.ANTAGONIX_DISCORD_TOKEN }}
          ANTAGONIX_FORCE: ${{ inputs.force == 'true' && '1' || '0' }}
          ANTAGONIX_DRY_RUN: ${{ inputs.dry_run == 'true' && '1' || '0' }}
          ANTAGONIX_INTERVAL_DAYS: "4"
          ANTAGONIX_THRESHOLD_DAYS: "4.5"
        run: node renew_antagonix.js

      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add antagonix_state.json || true
          if git diff --cached --quiet; then
            echo "No state change."
            exit 0
          fi
          git commit -m "Update Antagonix state [skip ci]"
          for i in 1 2 3; do
            git fetch origin antagonix
            if git rebase origin/antagonix && git push origin HEAD:antagonix; then
              echo "✅ state 已推送"; break
            fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
