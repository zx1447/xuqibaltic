name: Ajolote Fix Verify
on: workflow_dispatch
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: axolotl
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 单趟巡检（验证重试/容错/状态回写）
        env:
          AJOLOTE_EMAIL: ${{ secrets.AJOLOTE_EMAIL }}
          AJOLOTE_PASSWORD: ${{ secrets.AJOLOTE_PASSWORD }}
        run: python3 renew_ajolote.py
      - name: 回写状态（新逻辑）
        if: always()
        run: |
          git config user.name 'zx-build'
          git config user.email 'build@zx.local'
          if git diff --quiet ajolote_state.json 2>/dev/null && git diff --cached --quiet ajolote_state.json 2>/dev/null; then
            echo "无状态变化"; exit 0
          fi
          git add ajolote_state.json
          git commit -m "state: verify [skip ci]" || true
          for i in 1 2 3; do
            git fetch -q origin axolotl || true
            git -c user.name='zx-build' -c user.email='build@zx.local' rebase -X theirs origin/axolotl >/dev/null 2>&1 || git rebase --abort >/dev/null 2>&1 || true
            if git push origin HEAD:axolotl 2>/dev/null; then echo "✅ 状态已回写（第 $i 次）"; exit 0; fi
            echo "⚠️ 第 $i 次被拒，重试…"; sleep $((i*3))
          done
          echo "⚠️ 回写失败——不影响结论"
