name: MCWorldHost AFK Coin Farming

on:
  schedule:
    - cron: '47 * * * *' # Hourly: farm AFK watch coins (+3/60s, caps 150/h and 500/d)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcworldhost-afk
  cancel-in-progress: false

jobs:
  afk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: python -m pip install --quiet requests
      - name: Farm AFK coins
        env:
          MCWH_EMAIL: ${{ secrets.MCWH_EMAIL }}
          MCWH_PASSWORD: ${{ secrets.MCWH_PASSWORD }}
          MCWH_AFK_MAX_MINUTES: '52'
        run: python .github/scripts/mcworldhost_afk.py
