name: Active Panel Auto Renew & Phenix Server Monitor

on:
  # 每天检查一次；Phenix 每 1 天执行，Active 两个独立账号每 2 天执行。
  schedule:
    - cron: "20 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "是否立刻忽略间隔执行检测与登录（true/false）"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: active-auto-renew
  cancel-in-progress: true

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Active branch
        uses: actions/checkout@v4
        with:
          ref: Active
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk wget gnupg
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add - 2>/dev/null || true
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable || sudo apt-get install -y chromium-browser
          google-chrome --version || chromium-browser --version
          pip install --upgrade pip seleniumbase requests "requests[socks]"
          seleniumbase install chromedriver

      - name: Run Active & Phenix tasks
        env:
          ACTIVE_USER: ${{ secrets.ACTIVE_USER || secrets.ENZONIC_USER }}
          ACTIVE_PASS: ${{ secrets.ACTIVE_PASS || secrets.ENZONIC_PASS }}
          ACTIVE_COOKIE: ${{ secrets.ACTIVE_COOKIE || secrets.ENZONIC_COOKIE }}
          ACTIVE_SERVER_ID: ${{ secrets.ACTIVE_SERVER_ID || secrets.ENZONIC_SERVER_ID || '2d24e7a5' }}
          ACTIVE_PROXY: ${{ secrets.ACTIVE_PROXY || secrets.ENZONIC_PROXY }}
          ACTIVE_API_KEY: ${{ secrets.ACTIVE_API_KEY || secrets.ENZONIC_API_KEY }}
          PHENIX_API_KEY: ${{ secrets.PHENIX_API_KEY }}
          PHENIX_SERVER_UUID: "c0fbebc6"
          FORCE_RUN: ${{ github.event.inputs.force || 'false' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: xvfb-run --auto-servernum python3 renew_active.py

      - name: Save Active & Phenix state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add active_state.json || true
          if git diff --cached --quiet; then
            echo "No Active state change."
            exit 0
          fi
          git commit -m "Update Active & Phenix state [skip ci]"
          git push origin HEAD:Active
