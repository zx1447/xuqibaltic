name: GemHost Keepalive

# GemHost.pl 免费服守护：检测停止 → 自动拉起（免费服 6h/会话，耗尽自动停机）
#  · 【2026-11-13 加装甲】15 分钟 cron 被 GitHub schedule 饿死（22h 只送了 1 次）
#    → 改"330min 长驻循环（30 分钟一轮）+ GH_PAT 自派发接力 + schedule 兜底"（bkt 装甲）
#  · running/starting 不动，offline 即 start（拉起=新 6h 会话）
#  · cookie 缓存 gemhost_state.json，变化时回写 gemhost 分支
on:
  schedule:
    # 只作兜底：每 6 小时一次。主路径是末尾的「自派发接力」。
    # 原来 15 分钟一次会派发大量 330 分钟任务，排队互挤全变 cancelled。
    - cron: '3 */6 * * *'
  workflow_dispatch:
    inputs:
      run_minutes:
        description: '本轮守护时长（分钟，默认 330；快测填 3）'
        required: false
        default: '330'

concurrency:
  # 按 ref 隔离：main / axolotl / l3chrane 等各分支互不阻塞。
  # 同时兼容手动触发（无 ref 事件时回退到固定名）。
  group: gemhost-keepalive-${{ github.ref_name || 'manual' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gemhost

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 守护循环（每 30 分钟一轮，停机拉起）
        id: run
        env:
          GEMHOST_EMAIL: ${{ secrets.GEMHOST_EMAIL }}
          GEMHOST_PASSWORD: ${{ secrets.GEMHOST_PASSWORD }}
          RUN_MINUTES: ${{ github.event.inputs.run_minutes || '330' }}
        run: |
          set +e
          end=$((SECONDS + RUN_MINUTES * 60))
          n=0
          while [ $SECONDS -lt $end ]; do
            n=$((n+1))
            echo "—— [loop] 第 $n 轮（预算剩 $(( (end-SECONDS)/60 )) 分钟）——"
            # 自适应休眠：脚本按「距离会话到期还剩多久」算出该睡多久，
            # 保证在剩余时间跌破 15min 阈值之前就醒来，不会漏掉续期窗口。
            GITHUB_OUTPUT=/tmp/gh_out python3 gemhost_keepalive.py
            rc=$?
            if [ -f /tmp/gh_out ]; then
              grep '^next_wake_seconds=' /tmp/gh_out | tail -1 | cut -d= -f2 > /tmp/gh_wake || true
            fi
            if [ "$rc" = "3" ]; then echo "鉴权/配置死（rc=3），停止守护"; break; fi
            rest=$((end - SECONDS))
            [ $rest -le 0 ] && break

            sl=1800
            if [ -s /tmp/gh_wake ]; then
              w=$(cat /tmp/gh_wake)
              case "$w" in ''|*[!0-9]*) w=1800 ;; esac
              [ "$w" -ge 60 ] && [ "$w" -le 1800 ] && sl=$w
            fi
            [ $rest -lt $sl ] && sl=$rest
            echo "— [loop] 休眠 $((sl/60)) 分 $((sl%60)) 秒后复查 —"
            sleep $sl
          done
          echo "— [loop] 本轮预算用尽，交棒下一次运行 —"
          exit 0

      - name: 回写状态
        if: always()
        run: |
          git config user.name 'zx-build'
          git config user.email 'build@zx.local'
          if ! git diff --quiet gemhost_state.json 2>/dev/null || ! git diff --cached --quiet gemhost_state.json 2>/dev/null; then
            git add gemhost_state.json
            git commit -m "state: gemhost cookie cache [skip ci]" || true
            git push origin gemhost || true
          fi

      - name: 自派发接力（下一轮守护）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PAT 未配置，跳过接力（schedule 兜底）"
            exit 0
          fi
          # 必须显式指定 --ref main：默认分支才是唯一模板来源。
          # 不指定的话 GitHub 会用触发分支，从 axolotl 触发就会在 axolotl 上再派一条，
          # 进而演变成多分支无限自我复制。
          gh workflow run gemhost_keepalive.yml -R "$GITHUB_REPOSITORY" --ref main -f run_minutes=330 \
            && echo "✅ 已派发下一轮守护" \
            || echo "⚠️ 接力派发失败（schedule 兜底）"
