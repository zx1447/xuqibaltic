name: Lev Bot Renew

# 目标站 bot 续期（域名 / client_id / cookie 名已在脚本内 base64 混淆）。
# 脚本在 mws 分支（renew_mws.py），本 workflow 只负责调度与跑批。
#
# 续期规则：bot 有效期 7 天，随时可续（每次续期把 timer 重置为 7 天，实测同日连续两次都 200）。
# 节奏：用户要求每 4 天续一次；再加一条错位 2 天的兜底 cron —— 就算某次跑挂
#       （比如 trycloudflare 隧道临时换域名），最多还有 2 天窗口补救，不会直接断粮。
#
# 为什么必须走真浏览器 + 家宽：
#   - 续期接口要求 Cloudflare Turnstile token（403 captcha_required），纯 HTTP 过不了；
#   - Turnstile 挑战 iframe 在 closed shadow root 里，脚本用「页面几何换算 + pyautogui
#     真实点击复选框」的方式通过（SeleniumBase 的 uc_gui_click_captcha 找不到该 iframe）；
#   - 出口走自家 VLESS 家宽节点（MWS_VLESS_URL），数据中心 IP 直连容易被盾拦。
#
# 需要的 secrets：
#   MWS_DISCORD_TOKEN  Discord 用户 token（OAuth 自动登录，推荐配置）
#   MWS_VLESS_URL      可选，覆盖脚本内置节点；trycloudflare 换域名时更新它
#   MWS_SESSION_KEY    可选，Fernet key（登录态持久化用）
#   TG_BOT_TOKEN / TG_CHAT_ID  可选，结果通知

on:
  schedule:
    # 主节奏：每 4 天一次（北京时间 11:00）
    - cron: "0 3 1-29/4 * *"
    # 错位兜底：与主节奏相差 2 天，单次失败仍有补救窗口
    - cron: "0 3 3-31/4 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: lev-renew-${{ github.ref_name || 'manual' }}
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout mws branch
        uses: actions/checkout@v4
        with:
          ref: mws
          fetch-depth: 0

      - name: Install xray
        run: |
          mkdir -p "$HOME/.xray"
          curl -fsSL -o /tmp/xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o /tmp/xray.zip -d "$HOME/.xray"
          chmod +x "$HOME/.xray/xray"
          echo "XRAY_BIN=$HOME/.xray/xray" >> "$GITHUB_ENV"
          "$HOME/.xray/xray" version | head -1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure Chrome + Xvfb
        run: |
          google-chrome --version || sudo apt-get install -y google-chrome-stable
          which xvfb-run || sudo apt-get install -y xvfb

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install requests pysocks cryptography undetected-chromedriver pyautogui python-xlib setuptools

      - name: Run renew (inside Xvfb)
        env:
          MWS_DISCORD_TOKEN: ${{ secrets.MWS_DISCORD_TOKEN }}
          MWS_VLESS_URL: ${{ secrets.MWS_VLESS_URL }}
          MWS_SESSION_KEY: ${{ secrets.MWS_SESSION_KEY }}
          MWS_BOT_ID: "60"
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run -a --server-args="-screen 0 1366x768x24" python renew_mws.py

      - name: 提交登录态
        if: always()
        run: |
          if [ -f mws_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add mws_state.json
            git diff --cached --quiet || git commit -m "chore(mws): 更新登录态 [skip ci]"
            git pull --rebase --autostash origin mws || true
            git push origin HEAD:mws || true
          fi
