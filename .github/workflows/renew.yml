name: Auto Renew Server

on:
  schedule:
    # 每 4 天检测一次（UTC 03:00，北京时间 11:00）
    - cron: "0 3 */4 * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: auto-renew
  cancel-in-progress: true

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install and Start Cloudflare WARP SOCKS5 Proxy
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ noble main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp
          # 安装包已经启动 systemd 服务，不再重复执行 warp-svc（会报 socket already bound）。
          sudo systemctl restart warp-svc
          sleep 3
          warp-cli --accept-tos registration delete || true
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40001
          warp-cli --accept-tos connect
          sleep 4
          echo "=== WARP SOCKS5 PROXY CHECK ==="
          curl -fsS -x socks5h://127.0.0.1:40001 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|loc|warp)=' || true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps (Chrome)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg xvfb
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add - 2>/dev/null || true
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable || sudo apt-get install -y chromium-browser
          google-chrome --version || chromium-browser --version

      - name: Install Python deps
        run: pip install --upgrade pip seleniumbase cryptography

      - name: Install chromedriver
        run: python -m seleniumbase install chromedriver

      - name: Run renew
        env:
          BLINKY_USER: ${{ secrets.BLINKY_USER }}
          BLINKY_PASS: ${{ secrets.BLINKY_PASS }}
          SESSION_COOKIE: ${{ secrets.SESSION_COOKIE }}
          BLINKY_SESSION_KEY: ${{ secrets.BLINKY_SESSION_KEY }}
          SERVER_ID: ${{ secrets.SERVER_ID }}
          PROXY_SERVER: "socks5://127.0.0.1:40001"
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          # UC 的 GUI 验证点击必须运行在 Xvfb 有头模式，纯 headless 会卡在反爬页。
          HEADLESS: "false"
        run: python renew.py

      - name: Upload login diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: baltichost-login-diagnostics-${{ github.run_id }}
          path: |
            diagnostic_login.html
            diagnostic_login.png
          if-no-files-found: ignore
          retention-days: 3

      - name: Save BalticHost session state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add baltichost_state.json || true
          if git diff --cached --quiet; then
            echo "No BalticHost session state change."
            exit 0
          fi
          git commit -m "Update BalticHost session state [skip ci]"
          git push origin HEAD:main
