name: Teradata Keepalive

# 双 cron 提高触发率（GitHub schedule 会随机丢触发）:
#   - "23 * * * *"     每小时 :23（2026-11-11 平台空闲策略: 近 2h 无 Jupyter 活动即计空闲）
#   - "47 1-23/2 * * *" 奇数小时 :47
# 最大断档 ~84 分钟。每轮:
#   - 环境 STOPPING/STOPPED -> 幂等 start（STOPPED 时重发）
#   - 距 60 天到期 <= 3 天, 或环境已被平台回收 -> 删旧建新(同配置) + 自动重部署哪吒探针
#   - 面板无上报 -> kernel exec 拉起 watchdog/agent/v4proxy -> 仍无上报才 stop→start 重建
#     （重建后容器进程全清，脚本会重新拉起探针——2026-11-10 掉线复盘修复）
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "填 dry-run 则只登录+读状态，不做任何变更"
        required: false
        default: ""
  schedule:
    - cron: "23 * * * *"
    - cron: "47 1-23/2 * * *"

concurrency:
  group: teradata-keepalive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: teradata   # secrets 全部放在 environment "teradata" 下（repo secrets 已满 100 上限）
    steps:
      - uses: actions/checkout@v4
        with:
          ref: teradata

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install --quiet websocket-client

      - name: 保活 / 唤醒 / 到期重建
        id: run
        env:
          TD_EMAIL: ${{ secrets.TD_EMAIL }}
          TD_PASSWORD: ${{ secrets.TD_PASSWORD }}
          TD_ENV_PASSWORD: ${{ secrets.TD_ENV_PASSWORD }}
          NZ_SECRET: ${{ secrets.NZ_SECRET }}
          NZ_PANEL_USER: ${{ secrets.NZ_PANEL_USER }}
          NZ_PANEL_PASS: ${{ secrets.NZ_PANEL_PASS }}
        run: python td_keepalive.py ${{ github.event.inputs.mode == 'dry-run' && '--dry-run' || '' }}

      - name: 状态回写 teradata 分支
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "teradata-bot"
          git config user.email "bot@teradata.keepalive"
          git add td_state.json
          if git diff --cached --quiet; then
            echo "state 无变化，跳过"
          else
            git commit -m "td state: $(date -u '+%F %T') [skip ci]"
            git push "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}" teradata
          fi
