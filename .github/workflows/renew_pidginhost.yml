name: PidginHost Server Auto Renew

on:
  workflow_dispatch:
  schedule:
    # 每 7 天跑一次 (UTC 00:00)
    - cron: "0 0 */7 * *"

permissions:
  contents: read

concurrency:
  group: pidginhost-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PidginHost branch
        uses: actions/checkout@v4
        with:
          ref: pidginhost

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Run PidginHost renew
        env:
          PIDGINHOST_SESSION: ${{ secrets.PIDGINHOST_SESSION }}
          PIDGINHOST_CSRF: ${{ secrets.PIDGINHOST_CSRF }}
          PIDGINHOST_SERVER_ID: ${{ secrets.PIDGINHOST_SERVER_ID }}
        run: node renew_pidginhost.js
