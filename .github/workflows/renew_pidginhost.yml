name: PidginHost Server Auto Renew

on:
  workflow_dispatch:
  schedule:
    # 每 7 天跑一次 (UTC 00:00)
    - cron: "0 0 */7 * *"

permissions:
  contents: read

concurrency:
  group: pidginhost-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PidginHost branch
        uses: actions/checkout@v4
        with:
          ref: pidginhost

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (playwright + pynacl)
        run: |
          pip install playwright pynacl
          python -m playwright install chromium --with-deps

      - name: Run PidginHost renew (auto login + extend + refresh secret)
        env:
          DP_GH_USER: ${{ secrets.DP_GH_USER }}
          DP_GH_PASS: ${{ secrets.DP_GH_PASS }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PIDGINHOST_SERVER_ID: ${{ secrets.PIDGINHOST_SERVER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 renew_pidginhost.py
