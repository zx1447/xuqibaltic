name: PidginHost Server Auto Renew

on:
  workflow_dispatch:
  schedule:
    # 每 25 天跑一次 (延期 30 天, 留 5 天 buffer)
    - cron: "0 0 25 * *"

permissions:
  contents: read

concurrency:
  group: pidginhost-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PidginHost branch
        uses: actions/checkout@v4
        with:
          ref: pidginhost
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Run PidginHost renew
        env:
          PIDGINHOST_GH_USER: ${{ secrets.PIDGINHOST_GH_USER }}
          PIDGINHOST_GH_PASS: ${{ secrets.PIDGINHOST_GH_PASS }}
          PIDGINHOST_SERVER_ID: ${{ secrets.PIDGINHOST_SERVER_ID }}
        run: node renew_pidginhost.js
