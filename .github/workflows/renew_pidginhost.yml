name: PidginHost Server Auto Renew

on:
  workflow_dispatch:
  # schedule 已停用: 续期改在服务器自己上跑 cron (更稳, session 自动刷新)
  # 服务器 cron: /etc/cron.d/pidginhost-renew (每周一 0:00 UTC)
  # 如需恢复 GHA 自动跑, 取消下面两行注释:
  # schedule:
  #   - cron: "0 0 */7 * *"

permissions:
  contents: read

concurrency:
  group: pidginhost-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PidginHost branch
        uses: actions/checkout@v4
        with:
          ref: pidginhost

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run PidginHost renew (pure API)
        env:
          PIDGINHOST_SESSION: ${{ secrets.PIDGINHOST_SESSION }}
          PIDGINHOST_CSRF: ${{ secrets.PIDGINHOST_CSRF }}
          PIDGINHOST_API_TOKEN: ${{ secrets.PIDGINHOST_API_TOKEN }}
          PIDGINHOST_SERVER_ID: ${{ secrets.PIDGINHOST_SERVER_ID }}
        run: python3 renew_pidginhost.py
