name: PidginHost Server Auto Renew

on:
  schedule:
    # 每 4 天自动续期一次（UTC 02:30，北京时间 10:30）
    - cron: "30 2 */4 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "是否忽略 4 天间隔并立即续期（true/false）"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: pidginhost-auto-renew
  cancel-in-progress: true

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout PidginHost branch
        uses: actions/checkout@v4
        with:
          ref: pidginhost
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --upgrade pip requests "requests[socks]"

      - name: Run PidginHost renew
        env:
          # 建议填完整 Cookie：session/csrftoken 等，不要把明文写入仓库。
          PIDGINHOST_COOKIE: ${{ secrets.PIDGINHOST_COOKIE }}
          # 如果只有一个令牌值，则配合 PIDGINHOST_COOKIE_NAME 使用。
          PIDGINHOST_TOKEN: ${{ secrets.PIDGINHOST_TOKEN }}
          PIDGINHOST_COOKIE_NAME: ${{ secrets.PIDGINHOST_COOKIE_NAME }}
          PIDGINHOST_SERVER_ID: ${{ secrets.PIDGINHOST_SERVER_ID || '3853' }}
          PIDGINHOST_INTERVAL_DAYS: "4"
          PIDGINHOST_PROXY: ${{ secrets.PIDGINHOST_PROXY }}
          FORCE_RUN: ${{ github.event.inputs.force }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python renew_pidginhost.py

      - name: Save PidginHost state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pidginhost_state.json || true
          if git diff --cached --quiet; then
            echo "No PidginHost state change."
            exit 0
          fi
          git commit -m "Update PidginHost state [skip ci]"
          git push origin HEAD:pidginhost
