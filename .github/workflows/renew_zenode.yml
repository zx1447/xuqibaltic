name: Zenode Activity Confirmation

on:
  schedule:
    # 每天检查一次；仅在距离 activity_confirmation 到期最后 2 天内 POST 确认。
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: zenode-activity-confirm
  cancel-in-progress: true

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Zenode branch
        uses: actions/checkout@v4
        with:
          ref: zenode
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --upgrade pip requests "requests[socks]" cryptography
      - name: Run Zenode activity check
        env:
          ZENODE_DISCORD_TOKEN: ${{ secrets.ZENODE_DISCORD_TOKEN }}
          ZENODE_SESSION_KEY: ${{ secrets.ZENODE_SESSION_KEY }}
          ZENODE_PROXY: ${{ secrets.ZENODE_PROXY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python renew_zenode.py
      - name: Save Zenode session state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add zenode_state.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Zenode session state [skip ci]"
          git push origin HEAD:zenode
