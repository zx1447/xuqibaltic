name: Shiphsot Server Auto Renew
on:
  schedule:
    - cron: "0 1 */7 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "是否忽略 4 天间隔并立即续期（true/false）"
        required: false
        default: "false"
permissions:
  contents: write
concurrency:
  group: shiphsot-auto-renew
  cancel-in-progress: true
jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Shiphsot branch
        uses: actions/checkout@v4
        with:
          ref: shiphsot
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --upgrade pip requests "requests[socks]" cryptography
      - name: Run Shiphsot renew
        env:
          SHIPHSOT_USER: ${{ secrets.SHIPHSOT_USER }}
          SHIPHSOT_PASS: ${{ secrets.SHIPHSOT_PASS }}
          SHIPHSOT_SESSION_KEY: ${{ secrets.SHIPHSOT_SESSION_KEY }}
          SHIPHSOT_PROXY: ${{ secrets.SHIPHSOT_PROXY }}
          FORCE_RUN: ${{ github.event.inputs.force }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python renew_shiphsot.py
      - name: Save Shiphsot session state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add shiphsot_state.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Shiphsot session state [skip ci]"
          git push origin HEAD:shiphsot
