name: CoCalc Keepalive

on:
  workflow_dispatch:
  schedule:
    # 每 10 分钟跑一次 (cocalc Free idle 超时 30 分钟)
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: cocalc-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: cocalc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps

      - name: Run CoCalc keepalive
        env:
          COCALC_PROJECT: ${{ secrets.COCALC_PROJECT }}
          COCALC_COOKIE: ${{ secrets.COCALC_COOKIE }}
          NEZHA_PANEL: ${{ secrets.NEZHA_PANEL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python cocalc_keepalive.py
