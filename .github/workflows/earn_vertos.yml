name: Vertos AFK Earn

on:
  # 兜底触发；正常情况下每轮结束会自动派发下一轮。
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      run_minutes:
        description: "本轮运行分钟数（GitHub 单 job 上限 360）"
        required: false
        default: "355"
      stop_after_credits:
        description: "今日 credits 达到此值就停（0 = 不限）"
        required: false
        default: "0"

permissions:
  contents: write
  actions: write

concurrency:
  group: vertos-afk-earn
  cancel-in-progress: false

jobs:
  earn:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Checkout clean vertos branch
        uses: actions/checkout@v4
        with:
          ref: vertos
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --upgrade requests

      - name: Run Vertos AFK earn
        env:
          VERTOS_IDENTIFIER: ${{ secrets.VERTOS_IDENTIFIER }}
          VERTOS_PASSWORD: ${{ secrets.VERTOS_PASSWORD }}
          RUN_MINUTES: ${{ github.event.inputs.run_minutes || '355' }}
          HEARTBEAT_SECONDS: "30"
          STOP_AFTER_CREDITS: ${{ github.event.inputs.stop_after_credits || '0' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python earn_vertos.py

      - name: Save Vertos state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vertos_state.json || true
          if git diff --cached --quiet; then
            echo "No Vertos state change."
            exit 0
          fi
          git commit -m "Update Vertos state [skip ci]"
          git push origin HEAD:vertos

      - name: Re-trigger next round
        # 可选步骤：挂机成功就不该因为派发失败让整次运行变红。
        # 先试 GH_PAT，再退回 GITHUB_TOKEN，都失败只告警，由 6 小时兜底 cron 接手。
        if: success()
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          sleep 45
          url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/earn_vertos.yml/dispatches"
          body='{"ref":"vertos","inputs":{"run_minutes":"355","stop_after_credits":"0"}}'

          try_dispatch() {
            curl -sS -o /tmp/vertos-dispatch.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: token $1" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "$url" -d "$body" 2>/dev/null || echo 000
          }

          ok=""
          if [ -n "${GH_PAT}" ]; then
            code=$(try_dispatch "${GH_PAT}")
            echo "GH_PAT dispatch -> HTTP $code"
            [ "$code" = "204" ] && ok="GH_PAT"
          fi
          if [ -z "$ok" ]; then
            code=$(try_dispatch "${GITHUB_TOKEN}")
            echo "GITHUB_TOKEN dispatch -> HTTP $code"
            [ "$code" = "204" ] && ok="GITHUB_TOKEN"
          fi

          if [ -n "$ok" ]; then
            echo "Next Vertos round dispatched via $ok."
          else
            echo "::warning::Re-dispatch skipped (both tokens failed). Cron fallback will start the next round."
            head -c 300 /tmp/vertos-dispatch.json 2>/dev/null || true
          fi
