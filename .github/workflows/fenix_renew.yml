name: FenixHost Auto Renew

on:
  workflow_dispatch:
  # ⏸ 暂停（2026-11-13）：FenixHost 官网维护中，暂停定时运行，避免空跑烧 Actions 配额。
  # 维护结束后取消下面注释即可恢复（每 3 天 UTC 00:00）。
  # schedule:
  #   - cron: "0 0 */3 * *"

permissions:
  contents: read

concurrency:
  group: fenix-renew-${{ github.ref_name || 'manual' }}
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Run FenixHost renew
        env:
          DISCORD_TOKEN: ${{ secrets.FENIX_DISCORD_TOKEN }}
          FENIX_SERVICE: ${{ secrets.FENIX_SERVICE }}
        run: node fenix_renew.js
