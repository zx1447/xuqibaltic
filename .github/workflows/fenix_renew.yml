name: FenixHost Auto Renew

on:
  workflow_dispatch:
  schedule:
    # 每 3 天跑一次 (UTC 00:00)
    - cron: "0 0 */3 * *"

permissions:
  contents: read

concurrency:
  group: fenix-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Run FenixHost renew
        env:
          DISCORD_TOKEN: ${{ secrets.FENIX_DISCORD_TOKEN }}
          FENIX_SERVICE: ${{ secrets.FENIX_SERVICE }}
        run: node fenix_renew.js
