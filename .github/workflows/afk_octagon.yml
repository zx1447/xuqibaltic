name: Octagon AFK

# 每 20 分钟一轮，跑 15 分钟；响应中刷新滑动会话 cookie。
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: '本轮挂机分钟数'
        required: false
        default: '15'
  schedule:
    - cron: '*/20 * * * *'

concurrency:
  group: octagon-afk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  afk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 心跳挂机（顺带续期 cookie）
        id: afk
        env:
          OCTAGON_COOKIE: ${{ secrets.OCTAGON_COOKIE }}
          AFK_MINUTES: ${{ github.event.inputs.minutes || '15' }}
        run: node afk_octagon.js

      - name: 把续期后的 cookie 写回 secret
        if: always() && steps.afk.outputs.cookie != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NEW_COOKIE: ${{ steps.afk.outputs.cookie }}
        run: |
          printf '%s' "$NEW_COOKIE" | gh secret set OCTAGON_COOKIE --repo "$GITHUB_REPOSITORY"
          echo "✅ secret OCTAGON_COOKIE 已更新"

      # Do not self-dispatch after an API error (e.g. AFK disabled); let the cron fallback retry later.
      - name: 接力下一轮（成功时；cron 兜底）
        if: steps.afk.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh workflow run afk_octagon.yml --repo "$GITHUB_REPOSITORY" --ref main || \
            echo "⚠️ 接力 dispatch 失败，等待 cron 20 分钟内拉起"
