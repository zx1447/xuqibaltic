name: Migrate ZTO Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Copy legacy credentials to ZTO names
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          LEGACY_USER: ${{ secrets.ZYTRANO_USER }}
          LEGACY_PASS: ${{ secrets.ZYTRANO_PASS }}
        run: |
          test -n "$LEGACY_USER"
          test -n "$LEGACY_PASS"
          gh secret set ZTO_USER --repo "$GITHUB_REPOSITORY" --body "$LEGACY_USER"
          gh secret set ZTO_PASS --repo "$GITHUB_REPOSITORY" --body "$LEGACY_PASS"
          echo "ZTO secrets created."
