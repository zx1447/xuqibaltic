name: MineHost Free Server Renew

# MineHost 免费服务器续期（+6 小时/次）
#
# 走的是纯 HTTP，不碰 Cloudflare Turnstile：
#   refresh_token → access_token → GET /api/servers → POST /api/servers/:id/renew
# Turnstile 只在「发魔法链接登录」那一步，续期接口本身不校验。
#
# 需要的 secret
#   MINEHOST_REFRESH_TOKEN   Supabase 会话里的 refresh_token（约 30 天轮换一次）
#   GH_PAT                   可选，refresh_token 轮换后自动回写 secret
#
# 免费套餐是 6 小时 / 3 小时的碎窗口，所以默认每 3 小时一次、剩余 < 7 小时就点。

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只看不点"
        required: false
        default: "false"
      force:
        description: "无视剩余时间立即点"
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: minehost-renew
  cancel-in-progress: true

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: minehost

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 续期
        env:
          MINEHOST_SESSION: ${{ secrets.MINEHOST_REFRESH_TOKEN }}
          MINEHOST_RENEW_BELOW_H: "7"
          MINEHOST_DRY_RUN: ${{ inputs.dry_run == 'true' && '1' || '0' }}
          MINEHOST_FORCE: ${{ inputs.force == 'true' && '1' || '0' }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: node renew_minehost.js

      - name: 提交状态
        if: always()
        run: |
          rm -f package-lock.json
          git checkout -- . 2>/dev/null || true
          if [ -f minehost_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add minehost_state.json
            git diff --cached --quiet || git commit -m "chore(minehost): 更新续期状态 [skip ci]"
            git pull --rebase --autostash origin minehost || true
            git push origin HEAD:minehost || true
          fi
