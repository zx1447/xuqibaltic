name: Hostrix Renew

# 账号密码登录 + 精准定时续期
#  · 面板给 +24h / 次，冷却 11h
#  · cron 每 20 分钟巡检；页面显示可点时立即点
#  · 若已知精确边界（上次点击 + 11h）且落在等待窗口内，直接 sleep 到秒级边界再点
on:
  schedule:
    - cron: '3,23,43 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '无视冷却强行点击（仅调试）'
        required: false
        default: ''

concurrency:
  group: hostrix-renew-${{ github.ref_name || 'manual' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hostrix
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 登录并续期
        id: renew
        env:
          HOSTRIX_USER: ${{ secrets.HOSTRIX_USER }}
          HOSTRIX_PASS: ${{ secrets.HOSTRIX_PASS }}
          HOSTRIX_SERVER: cd86ccde4e34
          HR_WAIT_MAX: '1100'
          HR_FORCE: ${{ github.event.inputs.force }}
        run: python renew_hostrix.py

      - name: 汇总
        if: always()
        run: |
          echo "状态：${{ steps.renew.outputs.status }}"
          echo "剩余：${{ steps.renew.outputs.hours_left }}h"
          echo "下次可点：${{ steps.renew.outputs.next_allowed }}"
          echo "动作：${{ steps.renew.outputs.action }}"

      - name: 提交状态
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hostrix_state.json || true
          git diff --cached --quiet && echo "无状态变化" && exit 0
          git commit -m "Update Hostrix state [skip ci]"
          git push origin HEAD:hostrix
