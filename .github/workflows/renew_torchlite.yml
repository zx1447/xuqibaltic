name: Torchlite Auto Start

# 服务器处于「停止」状态就自动启动。不做窗口续期。
#
# 每次 start 会重新发放 40 分钟。到期自然下线后下一轮再拉起来，
# 等效于持续保活，且不受「只能到期前 5 分钟续期」这个窄窗口约束。
#
# 为什么用长驻 job 而不是 */5 cron：
#   实测本仓库的 */5 schedule 完全不触发（新 workflow 激活延迟 /
#   默认分支长期无提交会被自动禁用）。改成长驻 + 6 小时接力。
on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "跑多少分钟（默认 330）"
        required: false
        default: "330"
      tick_sec:
        description: "多少秒查一次（默认 60）"
        required: false
        default: "60"
      dry_run:
        description: "只看状态不动手"
        required: false
        default: "false"

permissions:
  contents: read

# 新的顶掉旧的：实测过长驻 job 会卡死（fetch/sleep 挂住），
# run 级 cancel 不生效，只有 concurrency 抢占能踢掉。
concurrency:
  group: torchlite-keepalive
  cancel-in-progress: true

jobs:
  autostart:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: torchlite

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Watchdog
        env:
          TORCHLITE_COOKIE: ${{ secrets.TORCHLITE_COOKIE }}
          TORCHLITE_UUID: "be89843c-8e77-4ce7-9fc4-c4d78a2b4ea1"
          TORCHLITE_LOOP_MINUTES: ${{ inputs.minutes || '330' }}
          TORCHLITE_TICK_SEC: ${{ inputs.tick_sec || '60' }}
          TORCHLITE_REQ_TIMEOUT_MS: "20000"
          TORCHLITE_DRY_RUN: ${{ inputs.dry_run == 'true' && '1' || '0' }}
        run: node watchdog.js
