name: Torchlite Renew

# Torchlite 免费服务器每次只发 40 分钟，只能在到期前最后 5 分钟续期。
# 所以 cron 必须密：每 5 分钟一次，8 次机会覆盖一个 40 分钟周期。
# 不在窗口的轮次会秒退（不睡），只有快到期的那一轮才会睡到窗口再点。
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "true = 无视窗口强行续期"
        required: false
        default: "false"
      dry_run:
        description: "true = 只看状态不点击"
        required: false
        default: "false"

permissions:
  contents: read

# 同一时间只跑一个，避免两个 job 同时抢窗口
concurrency:
  group: torchlite-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: torchlite

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Renew
        env:
          TORCHLITE_API_KEY: ${{ secrets.TORCHLITE_API_KEY }}
          TORCHLITE_SERVER_ID: "be89843c"
          TORCHLITE_MAX_WAIT_SEC: "660"
          TORCHLITE_FORCE: ${{ inputs.force == 'true' && '1' || '0' }}
          TORCHLITE_DRY_RUN: ${{ inputs.dry_run == 'true' && '1' || '0' }}
        run: node renew_torchlite.js
