name: SCYED Random Renew

on:
  # 已暂停自动运行，仅保留手动 workflow_dispatch。
  workflow_dispatch:
    inputs:
      force:
        description: "是否立即强制续期（true/false）"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: scyed-auto-renew
  cancel-in-progress: true

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout SCYED branch
        uses: actions/checkout@v4
        with:
          ref: scyed
          fetch-depth: 0

      - name: Install and start Cloudflare WARP SOCKS5 proxy
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ noble main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp
          sudo systemctl restart warp-svc
          sleep 3
          warp-cli --accept-tos registration delete || true
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40001
          warp-cli --accept-tos connect
          sleep 4
          echo "=== WARP CHECK ==="
          curl -fsS -x socks5h://127.0.0.1:40001 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|loc|warp)='

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install stealth browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          npm install
          npx playwright install-deps chrome

      - name: Run SCYED Playwright stealth renew
        env:
          SCYED_USER: ${{ secrets.SCYED_USER }}
          SCYED_PASS: ${{ secrets.SCYED_PASS }}
          # 未设置住宅代理时自动使用本机 WARP SOCKS5 出口。
          SCYED_PROXY: ${{ secrets.SCYED_PROXY || 'socks5://127.0.0.1:40001' }}
          FORCE_RUN: ${{ github.event.inputs.force }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" node scyed_browser.js

      - name: Save SCYED state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scyed_state.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update SCYED state [skip ci]"
          git push origin HEAD:scyed
