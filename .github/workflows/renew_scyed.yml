name: SCYED Random Renew

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "是否立即强制续期（true/false）"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: scyed-auto-renew
  cancel-in-progress: true

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout SCYED branch
        uses: actions/checkout@v4
        with:
          ref: scyed
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install real browser and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg xvfb
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add 2>/dev/null || true
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable || sudo apt-get install -y chromium-browser
          pip install --upgrade pip seleniumbase cryptography requests
          python -m seleniumbase install chromedriver

      - name: Run SCYED renew
        env:
          SCYED_USER: ${{ secrets.SCYED_USER }}
          SCYED_PASS: ${{ secrets.SCYED_PASS }}
          SCYED_SESSION_KEY: ${{ secrets.SCYED_SESSION_KEY }}
          SCYED_PROXY: ${{ secrets.SCYED_PROXY }}
          FORCE_RUN: ${{ github.event.inputs.force }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python renew_scyed.py

      - name: Save SCYED session state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scyed_state.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update SCYED session state [skip ci]"
          git push origin HEAD:scyed
