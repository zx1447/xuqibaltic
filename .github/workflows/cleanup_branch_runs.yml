name: Cleanup Old Workflow Runs

# 每隔 7 天清理一次 Actions 运行记录：
#   保留最新 14 页（14 × 100 = 1400 条），删除第 15 页及之后的所有记录。
#
# 不影响后续任务的安全保险：
#   - 只删 status=completed 的运行，进行中/排队的一律不动
#   - 不删 1 天内创建的记录（--min-age-days 1）
#   - 每个工作流无条件保留最近 1 次运行
#   - 结束时校验所有工作流仍为 active，并打印各自的 cron 供对照
on:
  schedule:
    # 每周二 UTC 03:00（北京时间 11:00）
    - cron: "0 3 * * 2"
  workflow_dispatch:
    inputs:
      keep_pages:
        description: "保留最新多少页（每页 100 条）"
        required: false
        default: "14"
      min_age_days:
        description: "不删多少天内创建的记录"
        required: false
        default: "1"
      apply:
        description: "true = 真删；false = 只干跑"
        required: false
        default: "true"

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-old-runs-${{ github.ref_name || 'manual' }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dry run (统计)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          KEEP_PAGES: ${{ inputs.keep_pages || '14' }}
          MIN_AGE_DAYS: ${{ inputs.min_age_days || '1' }}
          CLEANUP_WORKERS: "6"
        run: python scripts/cleanup_old_runs.py

      - name: Delete old runs
        if: ${{ inputs.apply != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          KEEP_PAGES: ${{ inputs.keep_pages || '14' }}
          MIN_AGE_DAYS: ${{ inputs.min_age_days || '1' }}
          CLEANUP_WORKERS: "6"
        run: python scripts/cleanup_old_runs.py --apply
