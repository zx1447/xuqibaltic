name: Cleanup Old Workflow Runs

# 每隔 7 天删除 14 天前的所有 Actions 运行记录。
# 范围：所有分支（含 main）、所有工作流；只删已结束的运行，正在跑的不动。
on:
  schedule:
    # 每周二 UTC 03:00（北京时间 11:00）
    - cron: "0 3 * * 2"
  workflow_dispatch:
    inputs:
      days:
        description: "删除多少天前的记录"
        required: false
        default: "14"
      apply:
        description: "true = 真删；false = 只干跑"
        required: false
        default: "true"

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-old-runs
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dry run (统计有多少要删)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CLEANUP_DAYS: ${{ inputs.days || '14' }}
          CLEANUP_WORKERS: "8"
        run: python scripts/cleanup_old_runs.py

      - name: Delete old runs
        if: ${{ inputs.apply != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CLEANUP_DAYS: ${{ inputs.days || '14' }}
          CLEANUP_WORKERS: "8"
        run: python scripts/cleanup_old_runs.py --apply
