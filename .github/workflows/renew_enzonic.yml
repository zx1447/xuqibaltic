name: Enzonic API Login Every 2 Days

on:
  # 每天检查一次；脚本内部严格按 2 天间隔决定是否登录。
  schedule:
    - cron: "20 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "是否忽略 2 天间隔并立即登录（true/false）"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: enzonic-api-login
  cancel-in-progress: true

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Enzonic branch
        uses: actions/checkout@v4
        with:
          ref: enzonic
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --upgrade requests

      - name: Run Enzonic API login
        env:
          ENZONIC_API_KEY: ${{ secrets.ENZONIC_API_KEY }}
          FORCE_RUN: ${{ github.event.inputs.force || 'false' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python renew_enzonic.py

      - name: Save Enzonic login state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add enzonic_state.json || true
          if git diff --cached --quiet; then
            echo "No Enzonic state change."
            exit 0
          fi
          git commit -m "Update Enzonic API login state [skip ci]"
          git push origin HEAD:enzonic
