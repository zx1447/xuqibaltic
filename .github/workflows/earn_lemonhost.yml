name: LemonHost AFK Claim

on:
  # 兜底触发：自派发失败时由这里接上。时间避开整点减少排队。
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      run_minutes:
        description: "本轮运行分钟数（GitHub 单 job 上限 360）"
        required: false
        default: "355"
      dry_run:
        description: "只探测接口不实际领取 (true/false)"
        required: false
        default: "false"

permissions:
  contents: write
  actions: write   # 自派发下一轮需要，否则只能用 PAT

concurrency:
  group: lemonhost-afk-claim-${{ github.ref_name || 'manual' }}
  cancel-in-progress: false

jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Checkout clean lemo branch
        uses: actions/checkout@v4
        with:
          ref: lemo
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --upgrade requests

      - name: Run LemonHost AFK claim
        env:
          LEMONHOST_API_KEY: ${{ secrets.LEMONHOST_API_KEY }}
          RUN_MINUTES: ${{ github.event.inputs.run_minutes || '355' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          TICK_SECONDS: "65"
          CAP_STALL_MINUTES: "30"
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python earn_lemonhost.py

      - name: Save LemonHost state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lemo_state.json || true
          if git diff --cached --quiet; then
            echo "No LemonHost state change."
            exit 0
          fi
          git commit -m "Update LemonHost state [skip ci]"
          git push origin HEAD:lemo

      - name: Re-trigger next round
        # 可选步骤：领取成功就不该因为派发失败让整次运行变红。
        # 先试 GH_PAT（可能已过期），再退回 GITHUB_TOKEN，两者都失败只告警，
        # 由 6 小时兜底 cron 接手。
        if: success()
        continue-on-error: true
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          sleep 45
          url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/earn_lemonhost.yml/dispatches"
          body='{"ref":"main","inputs":{"run_minutes":"355"}}'

          try_dispatch() {
            curl -sS -o /tmp/lemo-dispatch.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: token $1" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "$url" -d "$body" 2>/dev/null || echo 000
          }

          ok=""
          if [ -n "${GH_PAT}" ]; then
            code=$(try_dispatch "${GH_PAT}")
            echo "GH_PAT dispatch -> HTTP $code"
            [ "$code" = "204" ] && ok="GH_PAT"
          fi

          if [ -z "$ok" ]; then
            code=$(try_dispatch "${GITHUB_TOKEN}")
            echo "GITHUB_TOKEN dispatch -> HTTP $code"
            [ "$code" = "204" ] && ok="GITHUB_TOKEN"
          fi

          if [ -n "$ok" ]; then
            echo "Next LemonHost round dispatched via $ok."
          else
            echo "::warning::Re-dispatch skipped (both tokens failed). Cron fallback will start the next round."
            head -c 300 /tmp/lemo-dispatch.json 2>/dev/null || true
          fi
