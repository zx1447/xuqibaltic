name: Severoo Points Check

# 每天检查 Severoo 的积分能不能领。
#
# 注意：这里【不】自动提交领取请求 —— /api/points/claim 的判定依据是 hCaptcha token，
# 用脚本伪造它等于绕过对方的人机验证，本仓库不做这件事。
# 这个工作流只负责：
#   1. 用你的会话读 /api/points，判断是否已到可领时间
#   2. 可领时生成一个内嵌会话的一次性页面（artifact），你手机打开、勾验证码、点一下领取
#   3. 把余额/冷却写进 severoo_state.json，领没到账一目了然
#
# 需要的 secret
#   SEVEROO_COOKIES    浏览器 F12 → Application → Cookies → severoo.com 的 severoo-session + XSRF-TOKEN
#   SEVEROO_EMAIL / SEVEROO_PASSWORD   可选，cookie 过期时用来重登刷新

on:
  schedule:
    - cron: "23 0,12 * * *"     # 每天两次：UTC 00:23 / 12:23（北京时间 08:23 / 20:23）
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只看状态，不生成领取页"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: severoo-points
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: severoo

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 检查积分状态
        env:
          SEVEROO_COOKIES: ${{ secrets.SEVEROO_COOKIES }}
          SEVEROO_EMAIL: ${{ secrets.SEVEROO_EMAIL }}
          SEVEROO_PASSWORD: ${{ secrets.SEVEROO_PASSWORD }}
          SEVEROO_DRY_RUN: ${{ inputs.dry_run == 'true' && '1' || '0' }}
        run: node claim_points.js

      - name: 上传领取页
        if: hashFiles('claim.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: severoo-claim
          path: claim.html
          retention-days: 3

      - name: 清理内嵌会话的页面
        if: always()
        run: rm -f claim.html

      - name: 提交状态
        if: always()
        run: |
          rm -f package-lock.json
          git checkout -- . 2>/dev/null || true
          if [ -f severoo_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add severoo_state.json
            git diff --cached --quiet || git commit -m "chore(severoo): 更新积分状态 [skip ci]"
            git pull --rebase --autostash origin severoo || true
            git push origin HEAD:severoo || true
          fi
