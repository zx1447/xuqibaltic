name: VolyxHost AFK Earn

on:
  # 兜底触发；正常情况下每轮结束后会自动启动下一轮。
  schedule:
    - cron: "29 */6 * * *"
  workflow_dispatch:
    inputs:
      run_minutes:
        description: "本轮运行分钟数"
        required: false
        default: "340"

permissions:
  contents: write

concurrency:
  group: volyxhost-afk-earn
  cancel-in-progress: false

jobs:
  earn:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout clean volyxhost branch
        uses: actions/checkout@v4
        with:
          ref: volyxhost
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --upgrade requests beautifulsoup4 cryptography

      - name: Run VolyxHost AFK earn
        env:
          VOLYXHOST_EMAIL: ${{ secrets.VOLYXHOST_EMAIL }}
          VOLYXHOST_PASSWORD: ${{ secrets.VOLYXHOST_PASSWORD }}
          VOLYXHOST_SESSION_KEY: ${{ secrets.VOLYXHOST_SESSION_KEY }}
          RUN_MINUTES: ${{ github.event.inputs.run_minutes || '340' }}
          TICK_SECONDS: "61"
        run: python earn_volyxhost.py

      - name: Save VolyxHost state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add volyxhost_state.json || true
          if git diff --cached --quiet; then
            echo "No VolyxHost state change."
            exit 0
          fi
          git commit -m "Update VolyxHost AFK state [skip ci]"
          git push origin HEAD:volyxhost

      - name: Re-trigger next round
        if: success()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          sleep 45
          code=$(curl -sS -o /tmp/volyxhost-dispatch.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: token ${GH_PAT}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/earn_volyxhost.yml/dispatches" \
            -d '{"ref":"volyxhost","inputs":{"run_minutes":"340"}}')
          if [ "$code" != "204" ]; then
            echo "Re-dispatch failed: HTTP $code"
            cat /tmp/volyxhost-dispatch.json
            exit 1
          fi
          echo "Next VolyxHost round dispatched."
