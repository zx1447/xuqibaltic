name: DigitalPlat Domain Auto Renew

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 */2 *"

permissions:
  contents: write

concurrency:
  group: domain-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout domain branch
        uses: actions/checkout@v4
        with:
          ref: domain
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps (camoufox)
        run: |
          pip install --upgrade pip
          pip install "camoufox[geoip]"

      - name: Fetch Camoufox browser binary
        run: python3 -m camoufox fetch

      - name: Run renewal (Camoufox + Panel API)
        env:
          DIGITALPLAT_API_TOKEN: ${{ secrets.DIGITALPLAT_API_TOKEN }}
          DIGITALPLAT_DOMAINS: ${{ vars.DIGITALPLAT_DOMAINS }}
          DP_GH_USER: ${{ secrets.DP_GH_USER }}
          DP_GH_PASS: ${{ secrets.DP_GH_PASS }}
        run: python3 digitalplat_auto_renew.py --state state/domains-state.json

      - name: Commit updated renewal state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 不要把 dash cookies 推上去（含敏感凭据）
          rm -f state/dp-dash-cookies.json
          git add state/domains-state.json || true
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git commit -m "Update DigitalPlat domain renewal state [skip ci]"
          for i in 1 2 3 4; do
            git fetch origin domain
            if git rebase origin/domain; then
              if git push origin HEAD:domain; then
                echo "✅ domain 状态已推送"; break
              fi
            else
              git checkout --theirs -- state/domains-state.json 2>/dev/null || true
              git add state/domains-state.json 2>/dev/null || true
              git rebase --continue 2>/dev/null || git rebase --skip 2>/dev/null || true
              if git push origin HEAD:domain 2>/dev/null; then
                echo "✅ domain 状态已推送（冲突已解决）"; break
              fi
            fi
            echo "⚠️ 推送被拒，5s 后重试 ($i)…"
            sleep 5
          done
