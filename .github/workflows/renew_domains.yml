name: DigitalPlat Domain Auto Renew

on:
  workflow_dispatch:
  schedule:
    # 每 2 个月 1 号 UTC 00:00
    - cron: "0 0 1 */2 *"

permissions:
  contents: write

concurrency:
  group: domain-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout domain branch
        uses: actions/checkout@v4
        with:
          ref: domain
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run renewal check
        env:
          DIGITALPLAT_API_TOKEN: ${{ secrets.DIGITALPLAT_API_TOKEN }}
          DIGITALPLAT_DOMAINS: ${{ vars.DIGITALPLAT_DOMAINS }}
          DIGITALPLAT_RENEW_BEFORE_DAYS: "120"
        run: python digitalplat_auto_renew.py --state state/domains-state.json

      - name: Commit updated renewal state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/domains-state.json || true
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git commit -m "Update DigitalPlat domain renewal state [skip ci]"
          git push origin HEAD:domain
