name: DigitalPlat Domain Auto Renew

on:
  workflow_dispatch:
  schedule:
    # 每周一 UTC 04:17
    - cron: "17 4 * * 1"

permissions:
  contents: write

concurrency:
  group: domain-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout domain branch
        uses: actions/checkout@v4
        with:
          ref: domain
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright + camoufox
        run: |
          npm init -y
          npm install playwright camoufox
          npx playwright install chromium --with-deps
          npx camoufox fetch

      - name: Run domain renew
        env:
          DP_GH_USER: ${{ secrets.DP_GH_USER }}
          DP_GH_PASS: ${{ secrets.DP_GH_PASS }}
          DIGITALPLAT_API_TOKEN: ${{ secrets.DIGITALPLAT_API_TOKEN }}
        run: node renew_domains.js
