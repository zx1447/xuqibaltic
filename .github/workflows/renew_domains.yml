name: DigitalPlat Domain Auto Renew

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 */2 *"

permissions:
  contents: write

concurrency:
  group: domain-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: domain
          fetch-depth: 0

      - name: Install and Start Cloudflare WARP SOCKS5 Proxy
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ noble main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp
          sudo systemctl restart warp-svc
          sleep 3
          warp-cli --accept-tos registration delete || true
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40001
          warp-cli --accept-tos connect
          sleep 4
          echo "=== WARP SOCKS5 PROXY CHECK ==="
          curl -fsS -x socks5h://127.0.0.1:40001 https://www.cloudflare.com/cdn-cgi/trace | grep -E '^(ip|loc|warp)=' || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps (pysocks for SOCKS5 proxy)
        run: pip install --upgrade pip pysocks

      - name: Run renewal check
        env:
          DIGITALPLAT_API_TOKEN: ${{ secrets.DIGITALPLAT_API_TOKEN }}
          DIGITALPLAT_DOMAINS: ${{ vars.DIGITALPLAT_DOMAINS }}
          DIGITALPLAT_RENEW_BEFORE_DAYS: "120"
          PROXY_SERVER: "socks5://127.0.0.1:40001"
        run: python digitalplat_auto_renew.py --state state/domains-state.json

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/domains-state.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update domain state [skip ci]"
          # 并发推送保护：变基到最新 domain 后重试，冲突时采用本次运行生成的状态
          for i in 1 2 3 4; do
            git fetch origin domain
            if git rebase origin/domain; then
              if git push origin HEAD:domain; then
                echo "✅ domain 状态已推送"; break
              fi
            else
              git checkout --theirs -- state/domains-state.json 2>/dev/null || true
              git add state/domains-state.json 2>/dev/null || true
              git rebase --continue 2>/dev/null || git rebase --skip 2>/dev/null || true
              if git push origin HEAD:domain 2>/dev/null; then
                echo "✅ domain 状态已推送（冲突已解决）"; break
              fi
            fi
            echo "⚠️ 推送被拒，5s 后重试 ($i)…"
            sleep 5
          done
