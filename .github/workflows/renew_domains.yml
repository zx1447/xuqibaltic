name: DigitalPlat Domain Auto Renew

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 */2 *"

permissions:
  contents: write

concurrency:
  group: domain-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout domain branch
        uses: actions/checkout@v4
        with:
          ref: domain
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps (Chrome + Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg xvfb
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add - 2>/dev/null || true
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable || sudo apt-get install -y chromium-browser
          google-chrome --version || chromium-browser --version

      - name: Install Python deps (playwright)
        run: pip install --upgrade pip playwright

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run renewal (browser click)
        env:
          DIGITALPLAT_API_TOKEN: ${{ secrets.DIGITALPLAT_API_TOKEN }}
          DIGITALPLAT_DOMAINS: ${{ vars.DIGITALPLAT_DOMAINS }}
          DP_GH_USER: ${{ secrets.DP_GH_USER }}
          DP_GH_PASS: ${{ secrets.DP_GH_PASS }}
        run: xvfb-run -a python digitalplat_auto_renew.py --state state/domains-state.json

      - name: Commit updated renewal state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/domains-state.json || true
          if git diff --cached --quiet; then
            echo "No state changes."
            exit 0
          fi
          git commit -m "Update DigitalPlat domain renewal state [skip ci]"
          for i in 1 2 3 4; do
            git fetch origin domain
            if git rebase origin/domain; then
              if git push origin HEAD:domain; then
                echo "✅ domain 状态已推送"; break
              fi
            else
              git checkout --theirs -- state/domains-state.json 2>/dev/null || true
              git add state/domains-state.json 2>/dev/null || true
              git rebase --continue 2>/dev/null || git rebase --skip 2>/dev/null || true
              if git push origin HEAD:domain 2>/dev/null; then
                echo "✅ domain 状态已推送（冲突已解决）"; break
              fi
            fi
            echo "⚠️ 推送被拒，5s 后重试 ($i)…"
            sleep 5
          done
