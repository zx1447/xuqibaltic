name: DigitalPlat Domain Auto Renew

on:
  workflow_dispatch:
  schedule:
    # 每月 1 号 UTC 00:00 自动续期
    - cron: "0 0 1 * *"

permissions:
  contents: read

concurrency:
  group: domain-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout domain branch
        uses: actions/checkout@v4
        with:
          ref: domain

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright + stealth
        run: |
          npm init -y
          npm install playwright playwright-extra puppeteer-extra-plugin-stealth
          npx playwright install chromium --with-deps

      - name: Restore GitHub session
        uses: actions/cache@v4
        with:
          path: dp-session.json
          key: dp-gh-session-v1
          restore-keys: dp-gh-session-

      - name: Run domain renew
        env:
          DP_GH_USER: ${{ secrets.DP_GH_USER }}
          DP_GH_PASS: ${{ secrets.DP_GH_PASS }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node renew_domains.js

      - name: Save GitHub session
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dp-session.json
          key: dp-gh-session-${{ github.run_id }}
