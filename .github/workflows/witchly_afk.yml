name: Witchly AFK

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: witchly-afk
  cancel-in-progress: false

jobs:
  afk:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: witchly

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install xray
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq unzip
          curl -sL https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o /tmp/xray.zip
          unzip -o /tmp/xray.zip xray -d /tmp/
          chmod +x /tmp/xray

      - name: Run Witchly AFK
        env:
          DISCORD_TOKEN: ${{ secrets.WITCHLY_DISCORD_TOKEN }}
          DP_VLESS_URL: ${{ secrets.DP_VLESS_URL }}
          RUN_DURATION: "19800"
        run: python3 witchly_afk.py
