name: SkyMC Cookie Check

on:
  workflow_dispatch:
    inputs:
      password_login:
        description: "是否忽略 Cookie，强制测试账号密码浏览器登录（true/false）"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: skymc-cookie-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout SkyMC branch
        uses: actions/checkout@v4
        with:
          ref: skymc
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk wget gnupg
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add - 2>/dev/null || true
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable || sudo apt-get install -y chromium-browser
          google-chrome --version || chromium-browser --version
          pip install --upgrade pip requests "requests[socks]" seleniumbase
          seleniumbase install chromedriver

      - name: Run SkyMC cookie check
        env:
          SKYMC_COOKIE: ${{ secrets.SKYMC_COOKIE }}
          SKYMC_USER: ${{ secrets.SKYMC_USER }}
          SKYMC_PASS: ${{ secrets.SKYMC_PASS }}
          SKYMC_PROXY: ${{ secrets.SKYMC_PROXY }}
          SKYMC_FORCE_PASSWORD_LOGIN: ${{ github.event.inputs.password_login }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python renew_skymc.py

      - name: Save SkyMC state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skymc_state.json || true
          if git diff --cached --quiet; then
            echo "No SkyMC state change."
            exit 0
          fi
          git commit -m "Update SkyMC state [skip ci]"
          git push origin HEAD:skymc
