name: Siam Auto Check-in

on:
  workflow_dispatch:
  schedule:
    # 每天 UTC 00:00（北京时间 08:00）运行一次
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: siam-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    # 6 次签到之间等待约 1 小时，总运行时间约 5 小时。
    timeout-minutes: 355
    steps:
      - name: Checkout Siam branch
        uses: actions/checkout@v4
        with:
          ref: siam
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: Run Siam six check-ins
        env:
          SIAM_DISCORD_TOKEN: ${{ secrets.SIAM_DISCORD_TOKEN }}
          SIAM_CHECKIN_TARGET: "6"
          SIAM_CHECKIN_INTERVAL_SECONDS: "3610"
        run: node renew_siam.js

      - name: Save Siam state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add siam_state.json || true
          if git diff --cached --quiet; then
            echo "No Siam state change."
            exit 0
          fi
          git commit -m "Update Siam state [skip ci]"
          git push origin HEAD:siam
