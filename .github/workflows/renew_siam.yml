name: Siam Auto Check-in

on:
  workflow_dispatch:
  schedule:
    # 每轮 6 次签到完成后结束；下一天 UTC 00:00（北京时间 08:00）再启动。
    - cron: "0 0 * * *"

permissions:
  contents: write

concurrency:
  group: siam-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Siam branch
        uses: actions/checkout@v4
        with:
          ref: siam
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      # 关键一步：my.siam-node.cloud 对机房 IP 一律下发 Cloudflare JS 挑战，
      # 换到 Cloudflare WARP 出口后挑战不再触发（实测 direct=403 challenge / warp=302 无挑战）。
      # 方案移植自本仓库 domainvip 分支。
      - name: Start Cloudflare WARP SOCKS5 proxy
        run: |
          set -e
          mkdir -p /tmp/warp && cd /tmp/warp
          curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.32/wgcf_2.2.32_linux_amd64
          chmod +x wgcf
          curl -fsSL -o wireproxy.tar.gz https://github.com/windtf/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          tar -xzf wireproxy.tar.gz
          chmod +x wireproxy
          ./wgcf register --accept-tos
          ./wgcf generate
          printf '\n[Socks5]\nBindAddress = 127.0.0.1:40000\n' >> wgcf-profile.conf
          nohup ./wireproxy -c wgcf-profile.conf > /tmp/warp/wireproxy.log 2>&1 &
          echo "WARP_PID=$!" >> $GITHUB_ENV
          for i in $(seq 1 20); do
            if curl -fsS --max-time 5 -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace > /tmp/warp/trace; then break; fi
            sleep 1
          done
          echo "=== WARP trace ==="
          grep -E '^(ip|loc|warp)=' /tmp/warp/trace || echo "⚠️ WARP 未连上"

      - name: Verify Siam is reachable through WARP
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 -x socks5h://127.0.0.1:40000 \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36 Edg/150.0.0.0' \
            'https://my.siam-node.cloud/?p=topup' || echo 000)
          echo "Siam via WARP: HTTP $code"
          if [ "$code" = "403" ]; then
            echo "::warning::WARP 出口仍被 Cloudflare 拦（403），本次大概率失败"
          fi

      - name: Run Siam six check-ins
        env:
          SIAM_DISCORD_TOKEN: ${{ secrets.SIAM_DISCORD_TOKEN }}
          SIAM_CF_CLEARANCE: ${{ secrets.SIAM_CF_CLEARANCE }}
          SIAM_PROXY: "socks5://127.0.0.1:40000"
          SIAM_HEADFUL: "1"
          SIAM_CF_WAIT_MS: "45000"
          SIAM_CHECKIN_TARGET: "6"
          SIAM_CHECKIN_INTERVAL_SECONDS: "14"
        run: xvfb-run -a node renew_siam.js

      - name: Save Siam state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add siam_state.json || true
          if git diff --cached --quiet; then
            echo "No Siam state change."
            exit 0
          fi
          git commit -m "Update Siam state [skip ci]"
          git push origin HEAD:siam
