name: Siam Daily Check-in

on:
  schedule:
    # 每天执行一次签到，接口返回无法继续获取积分后停止本日循环。
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "是否忽略每日间隔并立即签到（true/false）"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: siam-daily-checkin
  cancel-in-progress: true

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Siam branch
        uses: actions/checkout@v4
        with:
          ref: siam
          fetch-depth: 0

      - name: Install and start Cloudflare WARP proxy
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ noble main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp
          sudo warp-svc &
          sleep 3
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode proxy || true
          warp-cli --accept-tos proxy port 40001 || true
          warp-cli --accept-tos connect || true
          sleep 4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --upgrade pip requests "requests[socks]" cryptography

      - name: Run Siam check-in
        env:
          SIAM_DISCORD_TOKEN: ${{ secrets.SIAM_DISCORD_TOKEN }}
          SIAM_SESSION_KEY: ${{ secrets.SIAM_SESSION_KEY }}
          SIAM_PROXY: "socks5://127.0.0.1:40001"
          FORCE_RUN: ${{ github.event.inputs.force }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python renew_siam.py

      - name: Save Siam session state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add siam_state.json || true
          if git diff --cached --quiet; then
            echo "No Siam state change."
            exit 0
          fi
          git commit -m "Update Siam check-in state [skip ci]"
          git push origin HEAD:siam
