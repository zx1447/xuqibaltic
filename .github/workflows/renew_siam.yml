name: Siam Auto Check-in

on:
  workflow_dispatch:
  schedule:
    # 每 2 小时跑一次 (每天 12 次, 每次签到 1-6 次直到 cooldown)
    # siam 规则: 每天 3 次, 每小时间隔, 首次 +35
    - cron: "0 */2 * * *"

permissions:
  contents: write

concurrency:
  group: siam-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Siam branch
        uses: actions/checkout@v4
        with:
          ref: siam
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --upgrade pip requests

      - name: Run Siam check-in
        env:
          SIAM_DISCORD_TOKEN: ${{ secrets.SIAM_DISCORD_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python renew_siam.py

      - name: Save Siam state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add siam_state.json || true
          if git diff --cached --quiet; then
            echo "No Siam state change."
            exit 0
          fi
          git commit -m "Update Siam state [skip ci]"
          git push origin HEAD:siam
