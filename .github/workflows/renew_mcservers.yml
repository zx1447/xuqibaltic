name: Discord Panel Renew

# 两个 Discord 面板续期，共用一个脚本，机制不同：
#
#   McServers  7 天有效期，只有到期后才能续（提前点回 "You can renew again later."）
#   Antagonix  5 天有效期，随时可点，点一次 = 从现在起重置 +5 天
#
# 调度策略：cron 每 2 天跑一次，脚本内部按各自规则判定：
#   - McServers：距上次成功点击满 5 天才点
#   - Antagonix：面板剩余 <= 4.5 天才点（用 embed 里的真实到期时间判定）
#
# cron 用固定间隔 */2 而不是按日字段，配合脚本自身判定更稳；
# 每 2 天一次意味着窗口错过最多耽误 2 天，对 5/7 天有效期的服务足够安全。
on:
  schedule:
    - cron: "37 6 */2 * *"
  workflow_dispatch:
    inputs:
      target:
        description: "mcservers / antagonix / all"
        required: false
        default: "all"
      force:
        description: "true = 无视间隔立即点"
        required: false
        default: "false"
      dry_run:
        description: "true = 只看判定不点击"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: discord-panel-renew
  cancel-in-progress: false

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: disordrenew

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install ws --no-audit --no-fund

      - name: Renew
        env:
          DISCORDERENEW_TOKEN: ${{ secrets.DISCORDERENEW_TOKEN }}
          ANTAGONIX_TOKEN: ${{ secrets.ANTAGONIX_TOKEN }}
          DR_TARGET: ${{ inputs.target || 'all' }}
          DR_FORCE: ${{ inputs.force == 'true' && '1' || '0' }}
          DR_DRY_RUN: ${{ inputs.dry_run == 'true' && '1' || '0' }}
          DR_LISTEN_MS: "20000"
        run: node renew_mcservers.js

      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f package-lock.json
          git checkout -- . 2>/dev/null || true
          git add disordrenew_state.json || true
          if git diff --cached --quiet -- disordrenew_state.json; then
            echo "No state change."
            exit 0
          fi
          for i in 1 2 3; do
            git fetch origin disordrenew
            git reset --soft origin/disordrenew 2>/dev/null || true
            git add disordrenew_state.json
            if git commit -q -m "Update renew state [skip ci]" && git push origin HEAD:disordrenew; then
              echo "✅ state 已推送"; exit 0
            fi
            sleep 3
          done
          echo "⚠️ state 推送失败，不影响续期本身"
