name: DomainVIP DevAPI Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe dev API
        env:
          DIGITALPLAT_API_TOKEN: ${{ secrets.DIGITALPLAT_API_TOKEN }}
        run: |
          curl -fsSL -o probe_api.py https://raw.githubusercontent.com/zx1447/xuqibaltic/domainvip/scripts/probe_api.py || exit 1
          python3 probe_api.py
