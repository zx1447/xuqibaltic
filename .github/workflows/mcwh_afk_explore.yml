name: MCWorldHost AFK Explore

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcworldhost-afk
  cancel-in-progress: false

jobs:
  explore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --quiet playwright==1.58.0 requests
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - name: Explore AFK page
        env:
          MCWH_EMAIL: ${{ secrets.MCWH_EMAIL }}
          MCWH_PASSWORD: ${{ secrets.MCWH_PASSWORD }}
        run: python .github/scripts/mcworldhost_afk_explore.py
      - name: Upload exploration snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcwh-debug-afk-explore
          path: |
            mcwh_afk_*.png
            mcwh_afk_*.txt
          if-no-files-found: ignore
